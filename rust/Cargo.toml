[workspace]
resolver = "3"
members = ["crates/protocol", "crates/engine", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# No panicking shortcuts in library or binary code. Tests are exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
