name: Release

# Req 40.1-40.3: build the TUI and the Engine, package them, and publish SHA-256 checksums.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows x64 (msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build tui and engine
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p tui -p engine --manifest-path rust/Cargo.toml

      - name: Stage archive contents
        shell: bash
        run: |
          set -euo pipefail
          out=rust/target/x86_64-pc-windows-msvc/release
          mkdir -p stage/oni
          cp "$out/tui.exe" stage/oni/oni-tui.exe
          cp "$out/engine.exe" stage/oni/oni-engine.exe
          mkdir -p stage/oni/fixtures
          cp fixtures/*.jsonl stage/oni/fixtures/
          cp LICENSE README.md stage/oni/

      - name: Smoke check
        shell: bash
        run: |
          set -euo pipefail
          ./stage/oni/oni-tui.exe --version
          ./stage/oni/oni-engine.exe --version

      - name: Package zip and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path stage/oni -DestinationPath dist/oni-tui-windows-x64.zip -Force
          Push-Location dist
          $hash = (Get-FileHash -Algorithm SHA256 oni-tui-windows-x64.zip).Hash.ToLower()
          "$hash  oni-tui-windows-x64.zip" | Out-File -Encoding ascii -NoNewline oni-tui-windows-x64.zip.sha256
          Add-Content -Encoding ascii -Path oni-tui-windows-x64.zip.sha256 -Value ""
          Pop-Location

      - name: Verify the zip unpacks and runs
        shell: pwsh
        run: |
          Expand-Archive -Path dist/oni-tui-windows-x64.zip -DestinationPath verify -Force
          & verify/oni/oni-tui.exe --version
          if ($LASTEXITCODE -ne 0) { throw "unpacked oni-tui failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: oni-tui-windows-x64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macos universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build tui and engine (both architectures)
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p tui -p engine --manifest-path rust/Cargo.toml
          done

      - name: Merge with lipo
        run: |
          set -euo pipefail
          mkdir -p stage/oni/fixtures
          for pair in tui:oni-tui engine:oni-engine; do
            src="${pair%%:*}"
            dst="${pair##*:}"
            lipo -create \
              "rust/target/aarch64-apple-darwin/release/$src" \
              "rust/target/x86_64-apple-darwin/release/$src" \
              -output "stage/oni/$dst"
            chmod +x "stage/oni/$dst"
            info="$(lipo -info "stage/oni/$dst")"
            echo "$info"
            case "$info" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "$dst is not a universal binary" >&2; exit 1 ;;
            esac
          done
          cp fixtures/*.jsonl stage/oni/fixtures/
          cp LICENSE README.md stage/oni/

      - name: Smoke check
        run: |
          set -euo pipefail
          ./stage/oni/oni-tui --version
          ./stage/oni/oni-engine --version

      - name: Package tar.gz and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/oni-tui-macos-universal.tar.gz -C stage oni
          (cd dist && shasum -a 256 oni-tui-macos-universal.tar.gz > oni-tui-macos-universal.tar.gz.sha256)

      - name: Verify the archive unpacks and runs
        run: |
          set -euo pipefail
          mkdir verify
          tar -xzf dist/oni-tui-macos-universal.tar.gz -C verify
          ./verify/oni/oni-tui --version

      - uses: actions/upload-artifact@v4
        with:
          name: oni-tui-macos-universal
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums and verify
        run: |
          set -euo pipefail
          cd artifacts
          cat oni-tui-windows-x64.zip.sha256 oni-tui-macos-universal.tar.gz.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/oni-tui-windows-x64.zip
            artifacts/oni-tui-macos-universal.tar.gz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
