# Render Blueprint for Oni (Req 38.1-38.5; also Req 16.1, 16.7, 16.9, 39).
# - oni-server: Docker web service built from ./Dockerfile (free plan). No database service:
#   orders, fills, and rejections live in memory for the current engine run only.
# - oni-web: static site, Next.js static export from web/ built with Bun 1.4.4.
# No secret values live in this file. OPENAI_API_KEY is set in the Render dashboard
# (sync: false). SESSION_SECRET is generated by Render (design Decision A12).

services:
  - type: web
    name: oni-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - server/**
        - rust/**
        - shared/**
        - fixtures/**
        - Dockerfile
        - package.json
        - bun.lock
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ENGINE_PATH
        value: /app/bin/engine
      # replay is safe for judges (no keys, deterministic). Set to "live" for public market data.
      - key: DATA_MODE
        value: replay
      # LIVE_VENUES is ignored in replay mode (design section 7).
      - key: LIVE_VENUES
        value: backpack,coinbase,jupiter,raydium
      - key: STARTING_BALANCE
        value: "100000"
      - key: BALANCE_SLIPPAGE_BPS
        value: "100"
      - key: KILL_SWITCH
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://oni-web.onrender.com
      - key: WEB_URL
        value: https://oni-web.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      # LLM providers. Keys are set in the Render dashboard, never in this file.
      # LLM_PROVIDER is left unset (server picks the first available provider); set it in the
      # dashboard to force one of ollama | openai | anthropic | nvidia.
      - key: LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # A URL can carry credentials, so it is a dashboard value. Empty uses the server default.
      - key: NVIDIA_BASE_URL
        sync: false
      # OLLAMA_BASE_URL and OLLAMA_MODEL are intentionally not set: Render cannot reach a local
      # Ollama. Add OLLAMA_BASE_URL (sync: false) only if you self-host Ollama at a public URL.
      # Model overrides (optional, set in the dashboard). Server defaults apply when unset.
      - key: OPENAI_MODEL
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: AI_RATE_PER_MIN
        value: "6"
      - key: AI_DAILY_CAP
        value: "500"
      # News. NewsAPI is development-only (its plan forbids production use), so NEWS_API_KEY is
      # not set here. Hosted uses CryptoPanic.
      - key: NEWS_PROVIDER
        value: cryptopanic
      - key: CRYPTOPANIC_API_KEY
        sync: false
      - key: CRYPTOPANIC_PLAN
        value: developer
      - key: NEWS_TTL_SECONDS
        value: "300"
      # Optional: raises the Jupiter Price API data rate limit. Authorizes no trading.
      - key: JUPITER_API_KEY
        sync: false

  - type: web
    name: oni-web
    runtime: static
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - web/**
        - shared/**
        - package.json
        - bun.lock
    buildCommand: |
      curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
      export PATH="$HOME/.bun/bin:$PATH"
      bun install --frozen-lockfile
      bun run --cwd web build
    staticPublishPath: ./web/out
    envVars:
      - key: NEXT_PUBLIC_WS_URL
        value: wss://oni-server.onrender.com/ws
      - key: NEXT_PUBLIC_API_URL
        value: https://oni-server.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
