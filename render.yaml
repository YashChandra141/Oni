# Render Blueprint for Oni (Req 38.1-38.5; also Req 16.1, 16.7, 16.9, 20.16, 39).
# - oni-server: Docker web service built from ./Dockerfile (free plan). Migrations run in the
#   Start_Script (server/scripts/start.ts, the Dockerfile CMD), so there is no preDeployCommand.
# - oni-web: static site, Next.js static export from web/ built with Bun 1.4.4.
# No secret values live in this file. DATABASE_URL, DIRECT_URL and OPENAI_API_KEY are set in the
# Render dashboard (sync: false). SESSION_SECRET is generated by Render (design Decision A12).
# JOURNAL_PATH and DB_ADAPTER are intentionally not declared.

services:
  - type: web
    name: oni-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - server/**
        - server/prisma/**
        - rust/**
        - shared/**
        - fixtures/**
        - Dockerfile
        - package.json
        - bun.lock
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ENGINE_PATH
        value: /app/bin/engine
      - key: DATA_MODE
        value: replay
      - key: LIVE_VENUE
        value: backpack
      - key: KILL_SWITCH
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://oni-web.onrender.com
      - key: WEB_URL
        value: https://oni-web.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: oni-web
    runtime: static
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - web/**
        - shared/**
        - package.json
        - bun.lock
    buildCommand: |
      curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
      export PATH="$HOME/.bun/bin:$PATH"
      bun install --frozen-lockfile
      bun run --cwd web build
    staticPublishPath: ./web/out
    envVars:
      - key: NEXT_PUBLIC_WS_URL
        value: wss://oni-server.onrender.com/ws
      - key: NEXT_PUBLIC_API_URL
        value: https://oni-server.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
